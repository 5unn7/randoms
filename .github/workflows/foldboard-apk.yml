name: FoldBoard APK

on:
  push:
    paths:
      - "foldboard/**"
      - ".github/workflows/foldboard-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foldboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foldboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Keep one debug signing key across runs so new APKs install over old ones
      # (used only when no release keystore secret is configured).
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: foldboard-debug-keystore-v1

      - name: Release keystore from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.FOLDBOARD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FOLDBOARD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Engine unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          FOLDBOARD_KEYSTORE_PASSWORD: ${{ secrets.FOLDBOARD_KEYSTORE_PASSWORD }}
          FOLDBOARD_KEY_ALIAS: ${{ secrets.FOLDBOARD_KEY_ALIAS }}
          FOLDBOARD_KEY_PASSWORD: ${{ secrets.FOLDBOARD_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FoldBoard-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FoldBoard-apk
          path: foldboard/dist/*.apk

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: foldboard-v0.1.${{ github.run_number }}
          name: FoldBoard 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: foldboard/dist/*.apk
          body: |
            FoldBoard keyboard build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download the APK on your phone, open it, and allow installing from this source.

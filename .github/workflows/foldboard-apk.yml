name: FoldBoard APK

on:
  push:
    paths:
      - "foldboard/**"
      - ".github/workflows/foldboard-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foldboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foldboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Every build must be signed with the same key or Android refuses to update the app.
      # The key file is committed but locked with a strong password kept in a repo secret.
      - name: Signing key
        env:
          KEY_PASSWORD: ${{ secrets.FOLDBOARD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the repository secret FOLDBOARD_KEY_PASSWORD (Settings > Secrets and variables > Actions) so APKs are signed with the permanent FoldBoard key."
            exit 1
          fi
          {
            echo "FOLDBOARD_KEYSTORE=$GITHUB_WORKSPACE/foldboard/signing/foldboard-release.p12"
            echo "FOLDBOARD_KEYSTORE_PASSWORD=$KEY_PASSWORD"
            echo "FOLDBOARD_KEY_PASSWORD=$KEY_PASSWORD"
            echo "FOLDBOARD_KEY_ALIAS=foldboard"
          } >> "$GITHUB_ENV"

      - name: Engine unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FoldBoard-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FoldBoard-apk
          path: foldboard/dist/*.apk

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: foldboard-v0.1.${{ github.run_number }}
          name: FoldBoard 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: foldboard/dist/*.apk
          body: |
            FoldBoard keyboard build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download the APK on your phone, open it, and allow installing from this source.
